name: Project Dependencies Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute as a Dry Run? (Log report only, no changes will be saved)'
        type: boolean
        required: true
        default: false

jobs:
  sync_deps:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout next-gen branch
        uses: actions/checkout@v7
        with:
          ref: next-gen

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Depcheck Globally
        run: npm install -g depcheck

      - name: Analyze and Process package.json
        id: sync_step
        run: |
          ANALYSIS_OUTPUT=$(depcheck --json --skip-missing=true) || true
          
          UNUSED_DEPS=$(echo "$ANALYSIS_OUTPUT" | jq -c '.dependencies')
          UNUSED_DEV_DEPS=$(echo "$ANALYSIS_OUTPUT" | jq -c '.devDependencies')
          MISSING_DEPS=$(echo "$ANALYSIS_OUTPUT" | jq -c '.missing | keys')

          export UNUSED_DEPS UNUSED_DEV_DEPS MISSING_DEPS
          export DRY_RUN_MODE="${{ inputs.dry_run }}"

          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            
            const unusedDeps = JSON.parse(process.env.UNUSED_DEPS || "[]");
            const unusedDevDeps = JSON.parse(process.env.UNUSED_DEV_DEPS || "[]");
            const missingDeps = JSON.parse(process.env.MISSING_DEPS || "[]");
            const isDryRun = process.env.DRY_RUN_MODE === "true";

            let changed = false;
            let logAdded = [];
            let logRemovedDeps = [];
            let logRemovedDevDeps = [];

            if (pkg.dependencies) {
              unusedDeps.forEach(dep => {
                if (pkg.dependencies[dep]) {
                  logRemovedDeps.push(dep);
                  changed = true;
                  if (!isDryRun) delete pkg.dependencies[dep];
                }
              });
            }

            if (pkg.devDependencies) {
              unusedDevDeps.forEach(dep => {
                if (pkg.devDependencies[dep]) {
                  logRemovedDevDeps.push(dep);
                  changed = true;
                  if (!isDryRun) delete pkg.devDependencies[dep];
                }
              });
            }

            if (missingDeps.length > 0) {
              if (!pkg.dependencies && !isDryRun) pkg.dependencies = {};
              missingDeps.forEach(dep => {
                const alreadyExists = pkg.dependencies && pkg.dependencies[dep];
                if (!alreadyExists) {
                  logAdded.push(dep);
                  changed = true;
                  if (!isDryRun) pkg.dependencies[dep] = "*";
                }
              });
            }

            if (!changed) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_changes=false\n");
              process.exit(0);
            }

            // Only write changes to disk if Dry Run is unchecked
            if (!isDryRun) {
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            }
            
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "has_changes=true\n");
            
            let prefix = isDryRun ? "🧪 **DRY RUN SIMULATION REPORT** (No files were modified):\\n\\n" : "The maintenance script updated package.json properties:\\n";
            let summary = prefix;
            if (logAdded.length) summary += `* **➕ To Add (Missing):** ${logAdded.join(", ")}\\n`;
            if (logRemovedDeps.length) summary += `* **🧹 To Remove Dependencies:** ${logRemovedDeps.join(", ")}\\n`;
            if (logRemovedDevDeps.length) summary += `* **🛠️ To Remove DevDependencies:** ${logRemovedDevDeps.join(", ")}\\n`;
            
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary_text=${summary}\n`);
          '

      - name: Commit Updated package.json
        # Only execute commit if changes exist AND dry run is false
        if: steps.sync_step.outputs.has_changes == 'true' && inputs.dry_run == false
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add package.json
          git commit -m "chore: automated sync of package.json dependencies"
          git push origin next-gen

      - name: Create Issue Notification Alert
        # Always create an issue report if changes are detected, showing you the layout regardless of mode
        if: steps.sync_step.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const isDryRun = ${{ inputs.dry_run }};
            const hasChanges = "${{ steps.sync_step.outputs.has_changes }}" === "true";
            
            let issueTitle = "";
            let issueBody = "";

            if (hasChanges) {
              issueTitle = isDryRun ? '🧪 Dry Run: Dependency Simulation Report' : '🔄 Automated Sync: package.json Updated';
              issueBody = `### Dependency Sync Worker\n\nBranch: \`next-gen\`\nTriggered by: @${context.actor}\n\n${{ steps.sync_step.outputs.summary_text }}`;
            } else {
              issueTitle = ( isDryRun ? '🧪 Dry Run: ' : '🔄 Automated Sync: ' ) + '✅ Dependency Check: Fully Synced';
              issueBody = `### Dependency Sync Worker\n\nBranch: \`next-gen\`\nTriggered by: @${context.actor}\n\nNo unused or missing dependencies were detected. Your \`package.json\` file is perfectly optimized and matches your code usage layout rules. No changes were made.`;
            }
            
            // 1. Create the issue and capture its API response data
            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              labels: ['maintenance'],
              assignees: [context.actor],
              body: issueBody
            });

            // 2. If there are no changes, immediately mark that specific issue number as closed
            if (!hasChanges) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: newIssue.data.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
